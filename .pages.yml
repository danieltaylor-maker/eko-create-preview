# Pages CMS settings for the Eko Create site (https://pagescms.org). Added by Claude, 7 October 2026.
# The portfolio videos are stored in assets/data/portfolio.json; assets/js/main.js reads that file, and assets/js/pages.js reads it for the service pages' Recent projects (17 Oct 2026).
# The photography gallery is stored in assets/data/photography.json; assets/js/pages.js reads that file (added 11 Oct 2026).
# Saving in Pages CMS commits to GitHub, and Netlify republishes the site about a minute later.
media:
  input: assets/images/photography
  output: /assets/images/photography
  extensions: [jpg, jpeg, png, webp]
content:
  - name: portfolio
    label: Portfolio videos
    type: file
    path: assets/data/portfolio.json
    format: json
    fields:
      - name: videos
        label: Videos
        type: object
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{client}: {title}"
        fields:
          - name: client
            label: Client
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
          - name: category
            label: Category
            description: Decides which filter button shows this video.
            type: select
            required: true
            options:
              values: [Film, Motion, Social]
          - name: vimeo
            label: Vimeo link
            description: "Paste the share link from Vimeo, for example https://vimeo.com/1234567890/abcdef1234. For a private video the link must include the code after the number."
            type: string
            required: true
          - name: description
            label: Description
            type: text
          - name: featured
            label: Featured
            description: Adds the featured style when the video is one of the first three shown.
            type: boolean
          - name: pages
            label: Also show on
            description: "Tick a service page to show this video in its Recent projects section, in the same order as this list. Thumbnails come straight from Vimeo."
            type: select
            options:
              multiple: true
              values: [Corporate video, Animation, Social media, Podcast]
  - name: photography
    label: Photography gallery
    type: file
    path: assets/data/photography.json
    format: json
    fields:
      - name: photos
        label: Photos
        description: Shown on the Photography page in this order. While the list is empty the page shows placeholder tiles.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{category}: {alt}"
        fields:
          - name: image
            label: Photo
            description: "Upload a JPG, about 2000 pixels on the longest side and under 500 KB, so the page loads quickly."
            type: image
            required: true
          - name: category
            label: Category
            description: Decides which filter button shows this photo.
            type: select
            options:
              values: [Studio, Workplace, Events]
          - name: alt
            label: Description (optional)
            description: Not shown on the page. Leave blank to use the generic description "Photography by Eko Create".
            type: string
